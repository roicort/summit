name: Civic Hall
address: 125 Avenida Madero Oriente
city: Centro, Morelia, Michoacan, Mexique
description: Un batiment civique restaure au coeur historique de Morelia, a quelques pas des cafes, hotels et places publiques.
heroImage: ../../../assets/blog-placeholder-5.png
arrival: Entrez par les portes principales de l'Avenida Madero. Les inscriptions ouvrent dans le hall; l'Auditorium est au rez-de-chaussee et le Studio a l'etage.
accessibility: Un acces sans marche est disponible par l'entree sud de la Calle Abasolo. Les deux salles proposent des places reservees et des toilettes accessibles se trouvent pres du hall.