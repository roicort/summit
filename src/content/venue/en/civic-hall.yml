name: Museo Nacional de Antropologia
address: Av. Paseo de la Reforma y Calzada Gandhi s/n
city: Chapultepec Polanco, Miguel Hidalgo, 11560 Mexico City, Mexico
description: Mexico's national museum of anthropology, set in Chapultepec and surrounded by the landscapes and histories that shape our conversations about the Earth.
heroImage: ../../../assets/blog-placeholder-5.png
arrival: Enter through the main doors on Paseo de la Reforma. Registration opens in the central lobby; the Auditorium is on the ground floor and the Studio is upstairs. The museum is reachable by Metro, Metrobús, bicycle, and on foot from Chapultepec.
accessibility: Step-free access is available at the south entrance on Calle Abasolo. Both event rooms have reserved seating and accessible restrooms are located beside the lobby.